<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Grocery-shopping barriers</title><desc id="desc">A horizontal bar chart showing cost at 62.4 percent, limited fresh or healthy options at 31.3 percent, transportation cost at 22.9 percent, and lack of time at 20.8 percent.</desc>
  <rect width="1200" height="600" fill="#10261f"/><g font-family="Arial, sans-serif"><text x="70" y="80" fill="#f7f3e8" font-size="30" font-weight="700">WHAT MAKES GROCERY SHOPPING DIFFICULT?</text><text x="70" y="116" fill="#a9b8b1" font-size="18">Share of all survey respondents</text>
  <g fill="#f7f3e8" font-size="21"><text x="70" y="205">Expensive groceries or produce</text><text x="70" y="295">Limited fresh or healthy options</text><text x="70" y="385">High transportation costs</text><text x="70" y="475">Lack of time</text></g>
  <g fill="#29453b"><rect x="410" y="176" width="650" height="38"/><rect x="410" y="266" width="650" height="38"/><rect x="410" y="356" width="650" height="38"/><rect x="410" y="446" width="650" height="38"/></g><g fill="#f2c94c"><rect x="410" y="176" width="624" height="38"/><rect x="410" y="266" width="313" height="38"/><rect x="410" y="356" width="229" height="38"/><rect x="410" y="446" width="208" height="38"/></g>
  <g fill="#4fc5a5" font-family="monospace" font-size="24" font-weight="700"><text x="1050" y="205">62.4%</text><text x="740" y="295">31.3%</text><text x="636" y="385">22.9%</text><text x="625" y="475">20.8%</text></g></g>
</svg>
