<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">Changes that would improve grocery trips by bus</title><desc id="desc">A horizontal bar chart showing free fares at 73 percent, discounts or a folding cart at 53 percent, carrying assistance at 44 percent, disability access at 38 percent, and a trip-planning app at 35 percent.</desc>
  <rect width="900" height="675" fill="#10261f"/><g font-family="Arial, sans-serif"><text x="55" y="70" fill="#f7f3e8" font-size="26" font-weight="700">BETTER GROCERY TRIPS BY BUS</text><text x="55" y="103" fill="#a9b8b1" font-size="16">Among residents wanting public transportation improved</text>
  <g fill="#f7f3e8" font-size="17"><text x="55" y="185">Free bus fares</text><text x="55" y="275">Discounts or folding cart</text><text x="55" y="365">Help carrying groceries</text><text x="55" y="455">Improved disability access</text><text x="55" y="545">Bus trip-planning app</text></g>
  <g fill="#29453b"><rect x="295" y="160" width="485" height="32"/><rect x="295" y="250" width="485" height="32"/><rect x="295" y="340" width="485" height="32"/><rect x="295" y="430" width="485" height="32"/><rect x="295" y="520" width="485" height="32"/></g><g fill="#ef7b5d"><rect x="295" y="160" width="438" height="32"/><rect x="295" y="250" width="318" height="32"/><rect x="295" y="340" width="264" height="32"/><rect x="295" y="430" width="228" height="32"/><rect x="295" y="520" width="210" height="32"/></g>
  <g fill="#4fc5a5" font-family="monospace" font-size="21" font-weight="700"><text x="745" y="186">73%</text><text x="625" y="276">53%</text><text x="571" y="366">44%</text><text x="535" y="456">38%</text><text x="517" y="546">35%</text></g></g>
</svg>
