<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">Health and wellness snapshot</title><desc id="desc">Three headline findings: 58 percent experience low or very low food security, 40 percent report fair or poor health, and 78 percent say fresh nutritious food reduces stress.</desc>
  <rect width="900" height="675" fill="#10261f"/><g font-family="Arial, sans-serif"><text x="60" y="74" fill="#f7f3e8" font-size="29" font-weight="700">HEALTH &amp; WELLNESS</text><text x="60" y="108" fill="#a9b8b1" font-size="17">Headline community findings</text>
  <g transform="translate(60 155)"><rect width="780" height="120" fill="#19382e"/><text x="32" y="75" fill="#4fc5a5" font-family="monospace" font-size="54" font-weight="700">58%</text><text x="210" y="53" fill="#f7f3e8" font-size="22" font-weight="700">Low or very low</text><text x="210" y="83" fill="#c8d3ce" font-size="20">food security</text></g>
  <g transform="translate(60 295)"><rect width="780" height="120" fill="#19382e"/><text x="32" y="75" fill="#f2c94c" font-family="monospace" font-size="54" font-weight="700">40%</text><text x="210" y="53" fill="#f7f3e8" font-size="22" font-weight="700">Fair or poor</text><text x="210" y="83" fill="#c8d3ce" font-size="20">self-described health</text></g>
  <g transform="translate(60 435)"><rect width="780" height="120" fill="#19382e"/><text x="32" y="75" fill="#ef7b5d" font-family="monospace" font-size="54" font-weight="700">78%</text><text x="210" y="53" fill="#f7f3e8" font-size="22" font-weight="700">Fresh, nutritious food</text><text x="210" y="83" fill="#c8d3ce" font-size="20">can reduce stress</text></g></g>
</svg>
